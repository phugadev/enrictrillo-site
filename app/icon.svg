<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Enric Trillo">
  <!--
    The dispersion mark, drawn for icon sizes: one grey beam in, four topic
    bands out. Strokes are 3 units on a 32 grid, with the fan spread wide so
    the bands stay separable in a browser tab.

    Colours are Minima's dark-mode values (styles/minima-palette.json), since
    the mark sits on the dark ground: background, gray-solid for the beam,
    foreground for the point, and each topic's -solid step — the same step the
    topic dots use on the page (lib/topics.ts). SVG favicons can't read CSS
    variables, so they are written out; re-copy them if Minima's palette moves.

    The dark background is deliberate. On a transparent icon the grey beam
    disappears against a light tab bar, and the mark loses its reading.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M4 16h8" stroke="#808080"/>
    <path d="M12 16 26 6.5" stroke="#e68d00"/>
    <path d="M12 16 28.5 12.5" stroke="#00b82d"/>
    <path d="M12 16 28.5 19.5" stroke="#0072ff"/>
    <path d="M12 16 26 25.5" stroke="#ac2fff"/>
  </g>
  <circle cx="12" cy="16" r="2.4" fill="#f2f2f2"/>
</svg>
